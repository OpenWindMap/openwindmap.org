# Config nginx pour Coolify
# - Le TLS et la redirection http -> https sont gérés par Traefik (Coolify)
# - nginx n'écoute donc que sur le port 80 interne

# ───────────────────────────────────────────────
# Site principal : www.test.openwindmap.org
# default_server : répond aussi aux health checks Coolify (Host = localhost/IP)
# ───────────────────────────────────────────────
server {
    listen 80 default_server;
    server_name www.${DOMAIN};

    root /usr/share/nginx/html;

    # Évite des redirections internes en http://host:80/...
    absolute_redirect off;

    # Fichiers tels quels, index de dossier, et URLs sans ".html"
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # healthcheck in coolify ressource
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Widget ──
    rewrite ^/widget/([a-zA-Z][a-zA-Z]|[a-zA-Z])[\d-]+$ /widget.html;
    rewrite ^/widget/([\d-]+)$ https://$host/widget/PP$1 permanent;

    # ── Anciens identifiants numériques -> URLs typées ──
    rewrite ^/[a-zA-Z]*([89]\d\d)$ https://$host/owm-$1 redirect;
    rewrite ^/[a-zA-Z]*(\d?\d?\d)$ https://$host/pioupiou-$1 redirect;
    rewrite ^/[a-zA-Z]*(10\d\d)$ https://$host/pioupiou-$1 redirect;
    rewrite ^/[a-zA-Z]*(11\d\d)$ https://$host/pioupiou-$1 redirect;
    rewrite ^/[a-zA-Z]*(12\d\d)$ https://$host/owm-$1 redirect;
    rewrite ^/[a-zA-Z]*(\d\d\d\d)$ https://$host/windbird-$1 redirect;

    # ── Pages dynamiques (rewrites internes, l'URL ne change pas) ──
    rewrite ^/[a-z]+-\d+$ /report.html;

    # ── Raccourcis vers la doc ──
    rewrite ^/data$ https://developers.pioupiou.fr/ redirect;
}

# ───────────────────────────────────────────────
# Domaine nu : test.openwindmap.org -> www
# ───────────────────────────────────────────────
server {
    listen 80;
    server_name ${DOMAIN};
    return 302 https://www.${DOMAIN}$request_uri;
}
